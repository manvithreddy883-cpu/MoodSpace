name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_NAME: "MyAwesomeApp"
      APP_ID: "com.mycompany.myawesomeapp"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 34 & Build-Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project & Build APK
        run: |
          cordova create build_app "$APP_ID" "$APP_NAME"
          rm -rf build_app/www/*
          if [ -d "www" ] && [ "$(ls -A www)" ]; then
            cp -r www/* build_app/www/
          else
            cp *.html *.css *.js build_app/www/ 2>/dev/null || true
          fi
          cd build_app
          cordova platform add android@13.0.0
          cordova build android

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: build_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
